services:
  postgres:
    image: postgres:16-alpine
    container_name: vakera-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vakera_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vakera_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: