services:
  postgres:
    image: postgres:16-alpine
    container_name: vakera-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vakera_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vakera_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-python:
    build:
      context: ./server_py
      dockerfile: Dockerfile
    container_name: vakera-django
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/vakera_db?schema=public}
      - JWT_SECRET=${JWT_SECRET:-vakera_super_secret_jwt_key_2026}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-vakera-django-dev-secret-key-2026-solo-desarrollo-local-50chars}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend-python}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: